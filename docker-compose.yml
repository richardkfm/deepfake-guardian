version: "3.9"

services:
  engine:
    build: ./engine
    # Bots reach the engine over the internal "moderation" network. Publish
    # the port on loopback only: API_KEY is empty by default, and binding
    # 0.0.0.0 would expose moderation, GDPR and protected-image endpoints
    # unauthenticated to anyone who can reach the host. Set API_KEY before
    # changing this to "8000:8000".
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./engine/.env
    volumes:
      - hf-cache:/root/.cache/huggingface
      - onnx-models:/root/.cache/deepfake_guardian
      - engine-db:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/deepfake_guardian.db
    networks:
      - moderation
    restart: unless-stopped

  telegram-bot:
    build: ./telegram-bot
    env_file:
      - ./telegram-bot/.env
    depends_on:
      - engine
    networks:
      - moderation
    restart: unless-stopped

  whatsapp-bot:
    build: ./whatsapp-bot
    env_file:
      - ./whatsapp-bot/.env
    depends_on:
      - engine
    volumes:
      - wa-session:/app/auth_info
    networks:
      - moderation
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  moderation:
    driver: bridge

volumes:
  hf-cache:
  onnx-models:
  wa-session:
  engine-db:
